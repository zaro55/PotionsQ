name: Build PotionsQ

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Gradle 9.2
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.2/bin" >> "$GITHUB_PATH"

      - name: Build JAR
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PotionsQ
          path: build/libs/*.jar
